<!DOCTYPE html>
<html lang="id">
<head>
  <title>Pengaturan Template ID Card - Admin SPMB</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .card-custom { border: none; border-radius: 15px; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    .card-custom:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
    .id-card-preview { width: 350px; height: 220px; border: 2px dashed #ddd; margin: 20px auto; position: relative; background: white; }
    .id-card-element { position: absolute; cursor: move; user-select: none; }
    .id-card-text { font-size: 12px; color: #333; }
    .id-card-logo { max-width: 60px; max-height: 60px; }
    .control-panel { background: #f8f9fa; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    .btn-custom { background: #0141a4; color: white; border: none; border-radius: 10px; }
    .btn-custom:hover { background: #003080; }
  </style>
</head>
<body>
  <div class="container mt-4">
    <div class="row">
      <div class="col-12">
        <h3 class="mb-4"><i class="fas fa-id-card me-2"></i>Pengaturan Template ID Card Siswa</h3>

        <div class="row">
          <!-- Control Panel -->
          <div class="col-md-4">
            <div class="card card-custom">
              <div class="card-body">
                <h5 class="card-title">Pengaturan Template</h5>

                <div class="control-panel">
                  <h6><i class="fas fa-image me-2"></i>Background & Logo</h6>
                  <div class="form-group">
                    <label for="backgroundImage" class="form-label">Upload Background ID Card</label>
                    <input type="file" class="form-control" id="backgroundImage" accept="image/*">
                  </div>
                  <div class="form-group">
                    <label for="logoImage" class="form-label">Upload Logo Sekolah</label>
                    <input type="file" class="form-control" id="logoImage" accept="image/*">
                  </div>

                  <hr>

                  <h6><i class="fas fa-font me-2"></i>Elemen Teks</h6>
                  <div class="form-group">
                    <label for="schoolName" class="form-label">Nama Sekolah</label>
                    <input type="text" class="form-control" id="schoolName" value="SDIT INSAN RABBANI">
                  </div>
                  <div class="form-group">
                    <label for="schoolAddress" class="form-label">Alamat Sekolah</label>
                    <input type="text" class="form-control" id="schoolAddress" value="Jl. Contoh No. 123, Kota">
                  </div>
                  <div class="form-group">
                    <label for="academicYear" class="form-label">Tahun Ajaran</label>
                    <input type="text" class="form-control" id="academicYear" value="2026/2027">
                  </div>

                  <hr>

                  <h6><i class="fas fa-cogs me-2"></i>Posisi & Ukuran</h6>
                  <div class="form-group">
                    <label for="logoPosition" class="form-label">Posisi Logo (X,Y)</label>
                    <div class="row">
                      <div class="col-6">
                        <input type="number" class="form-control" id="logoX" placeholder="X" value="20">
                      </div>
                      <div class="col-6">
                        <input type="number" class="form-control" id="logoY" placeholder="Y" value="20">
                      </div>
                    </div>
                  </div>
                  <div class="form-group">
                    <label for="textPosition" class="form-label">Posisi Teks Utama (X,Y)</label>
                    <div class="row">
                      <div class="col-6">
                        <input type="number" class="form-control" id="textX" placeholder="X" value="100">
                      </div>
                      <div class="col-6">
                        <input type="number" class="form-control" id="textY" placeholder="Y" value="80">
                      </div>
                    </div>
                  </div>

                  <hr>

                  <div class="d-grid gap-2">
                    <button onclick="saveTemplate()" class="btn btn-custom">
                      <i class="fas fa-save me-2"></i>Simpan Template
                    </button>
                    <button onclick="loadTemplate()" class="btn btn-outline-primary">
                      <i class="fas fa-upload me-2"></i>Load Template
                    </button>
                    <button onclick="resetTemplate()" class="btn btn-outline-danger">
                      <i class="fas fa-undo me-2"></i>Reset
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Preview Panel -->
          <div class="col-md-8">
            <div class="card card-custom">
              <div class="card-body">
                <h5 class="card-title">Preview ID Card</h5>
                <div class="text-center">
                  <div class="id-card-preview" id="idCardPreview">
                    <!-- ID Card elements will be dynamically added here -->
                  </div>
                  <small class="text-muted mt-2 d-block">
                    Preview ID Card - Elemen dapat dipindah dengan drag & drop
                  </small>
                </div>

                <hr>

                <h6>Test Data Siswa</h6>
                <div class="row">
                  <div class="col-md-6">
                    <div class="form-group">
                      <label for="testName" class="form-label">Nama Siswa</label>
                      <input type="text" class="form-control" id="testName" value="Ahmad Abdullah">
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="form-group">
                      <label for="testNoReg" class="form-label">No Registrasi</label>
                      <input type="text" class="form-control" id="testNoReg" value="SPMB2026001">
                    </div>
                  </div>
                </div>
                <button onclick="updatePreview()" class="btn btn-outline-info mt-2">
                  <i class="fas fa-refresh me-2"></i>Update Preview
                </button>
              </div>
            </div>

            <!-- Generate ID Card Section -->
            <div class="card card-custom mt-4">
              <div class="card-body">
                <h5 class="card-title">Generate ID Card Siswa</h5>
                <div class="form-group">
                  <label for="generateNoReg" class="form-label">No Registrasi Siswa</label>
                  <input type="text" class="form-control" id="generateNoReg" placeholder="Masukkan No Reg untuk generate ID Card">
                </div>
                <button onclick="generateIDCard()" class="btn btn-success">
                  <i class="fas fa-magic me-2"></i>Generate ID Card
                </button>
                <div id="generatedCard" class="mt-3" style="display: none;">
                  <div class="alert alert-success">
                    ID Card berhasil di-generate! <a href="#" id="downloadLink" class="alert-link">Download di sini</a>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Back to Admin -->
        <div class="mt-4">
          <a href="admin.html" class="btn btn-secondary">
            <i class="fas fa-arrow-left me-2"></i>Kembali ke Dashboard Admin
          </a>
        </div>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    if(localStorage.getItem('isLogin') !== 'true') window.location.href='login.html';

    let templateData = {
      backgroundImage: null,
      logoImage: null,
      schoolName: 'SDIT INSAN RABBANI',
      schoolAddress: 'Jl. Contoh No. 123, Kota',
      academicYear: '2026/2027',
      logoPosition: { x: 20, y: 20 },
      textPosition: { x: 100, y: 80 }
    };

    // Initialize
    document.addEventListener('DOMContentLoaded', function() {
      loadTemplate();
      updatePreview();
      setupDragAndDrop();
    });

    // File input handlers
    document.getElementById('backgroundImage').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          templateData.backgroundImage = e.target.result;
          updatePreview();
        };
        reader.readAsDataURL(file);
      }
    });

    document.getElementById('logoImage').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          templateData.logoImage = e.target.result;
          updatePreview();
        };
        reader.readAsDataURL(file);
      }
    });

    // Input change handlers
    document.querySelectorAll('input[type="text"], input[type="number"]').forEach(input => {
      input.addEventListener('input', updateTemplateData);
    });

    function updateTemplateData() {
      templateData.schoolName = document.getElementById('schoolName').value;
      templateData.schoolAddress = document.getElementById('schoolAddress').value;
      templateData.academicYear = document.getElementById('academicYear').value;
      templateData.logoPosition.x = parseInt(document.getElementById('logoX').value) || 20;
      templateData.logoPosition.y = parseInt(document.getElementById('logoY').value) || 20;
      templateData.textPosition.x = parseInt(document.getElementById('textX').value) || 100;
      templateData.textPosition.y = parseInt(document.getElementById('textY').value) || 80;
      updatePreview();
    }

    function updatePreview() {
      const preview = document.getElementById('idCardPreview');
      const testName = document.getElementById('testName').value;
      const testNoReg = document.getElementById('testNoReg').value;

      // Clear previous content
      preview.innerHTML = '';

      // Set background if exists
      if (templateData.backgroundImage) {
        preview.style.backgroundImage = `url(${templateData.backgroundImage})`;
        preview.style.backgroundSize = 'cover';
        preview.style.backgroundPosition = 'center';
      } else {
        preview.style.backgroundImage = 'none';
        preview.style.backgroundColor = '#f8f9fa';
      }

      // Add logo if exists
      if (templateData.logoImage) {
        const logo = document.createElement('img');
        logo.src = templateData.logoImage;
        logo.className = 'id-card-logo id-card-element';
        logo.style.left = templateData.logoPosition.x + 'px';
        logo.style.top = templateData.logoPosition.y + 'px';
        logo.draggable = false;
        preview.appendChild(logo);
      }

      // Add text elements
      const textContainer = document.createElement('div');
      textContainer.className = 'id-card-element';
      textContainer.style.left = templateData.textPosition.x + 'px';
      textContainer.style.top = templateData.textPosition.y + 'px';
      textContainer.innerHTML = `
        <div class="id-card-text fw-bold">${templateData.schoolName}</div>
        <div class="id-card-text">${templateData.schoolAddress}</div>
        <div class="id-card-text">Tahun Ajaran: ${templateData.academicYear}</div>
        <hr style="margin: 5px 0; border-color: #333;">
        <div class="id-card-text"><strong>Nama:</strong> ${testName}</div>
        <div class="id-card-text"><strong>No Reg:</strong> ${testNoReg}</div>
        <div class="id-card-text"><strong>Status:</strong> SISWA AKTIF</div>
      `;
      preview.appendChild(textContainer);
    }

    function setupDragAndDrop() {
      let draggedElement = null;
      let offsetX, offsetY;

      document.addEventListener('mousedown', function(e) {
        if (e.target.classList.contains('id-card-element')) {
          draggedElement = e.target;
          const rect = draggedElement.getBoundingClientRect();
          offsetX = e.clientX - rect.left;
          offsetY = e.clientY - rect.top;
          draggedElement.style.cursor = 'grabbing';
        }
      });

      document.addEventListener('mousemove', function(e) {
        if (draggedElement) {
          const preview = document.getElementById('idCardPreview');
          const previewRect = preview.getBoundingClientRect();
          const x = e.clientX - previewRect.left - offsetX;
          const y = e.clientY - previewRect.top - offsetY;

          draggedElement.style.left = Math.max(0, Math.min(x, previewRect.width - draggedElement.offsetWidth)) + 'px';
          draggedElement.style.top = Math.max(0, Math.min(y, previewRect.height - draggedElement.offsetHeight)) + 'px';
        }
      });

      document.addEventListener('mouseup', function(e) {
        if (draggedElement) {
          draggedElement.style.cursor = 'move';
          draggedElement = null;
          updatePositionInputs();
        }
      });
    }

    function updatePositionInputs() {
      const logo = document.querySelector('.id-card-logo');
      const textContainer = document.querySelector('.id-card-element:not(.id-card-logo)');

      if (logo) {
        const logoRect = logo.getBoundingClientRect();
        const previewRect = document.getElementById('idCardPreview').getBoundingClientRect();
        templateData.logoPosition.x = logoRect.left - previewRect.left;
        templateData.logoPosition.y = logoRect.top - previewRect.top;
        document.getElementById('logoX').value = Math.round(templateData.logoPosition.x);
        document.getElementById('logoY').value = Math.round(templateData.logoPosition.y);
      }

      if (textContainer) {
        const textRect = textContainer.getBoundingClientRect();
        const previewRect = document.getElementById('idCardPreview').getBoundingClientRect();
        templateData.textPosition.x = textRect.left - previewRect.left;
        templateData.textPosition.y = textRect.top - previewRect.top;
        document.getElementById('textX').value = Math.round(templateData.textPosition.x);
        document.getElementById('textY').value = Math.round(templateData.textPosition.y);
      }
    }

    function saveTemplate() {
      localStorage.setItem('idCardTemplate', JSON.stringify(templateData));
      alert('Template ID Card berhasil disimpan!');
    }

    function loadTemplate() {
      const saved = localStorage.getItem('idCardTemplate');
      if (saved) {
        templateData = JSON.parse(saved);
        updateFormFromTemplate();
        updatePreview();
      }
    }

    function updateFormFromTemplate() {
      document.getElementById('schoolName').value = templateData.schoolName;
      document.getElementById('schoolAddress').value = templateData.schoolAddress;
      document.getElementById('academicYear').value = templateData.academicYear;
      document.getElementById('logoX').value = templateData.logoPosition.x;
      document.getElementById('logoY').value = templateData.logoPosition.y;
      document.getElementById('textX').value = templateData.textPosition.x;
      document.getElementById('textY').value = templateData.textPosition.y;
    }

    function resetTemplate() {
      if (confirm('Apakah Anda yakin ingin mereset template ke pengaturan default?')) {
        templateData = {
          backgroundImage: null,
          logoImage: null,
          schoolName: 'SDIT INSAN RABBANI',
          schoolAddress: 'Jl. Contoh No. 123, Kota',
          academicYear: '2026/2027',
          logoPosition: { x: 20, y: 20 },
          textPosition: { x: 100, y: 80 }
        };
        updateFormFromTemplate();
        updatePreview();
        localStorage.removeItem('idCardTemplate');
      }
    }

    async function generateIDCard() {
      const noReg = document.getElementById('generateNoReg').value.trim();
      if (!noReg) {
        alert('Masukkan No Registrasi!');
        return;
      }

      try {
        // Get student data from GAS
        const res = await fetch(CONFIG_API_URL, {
          method: "POST",
          body: JSON.stringify({ action: "getRegistrantDetails", noReg: noReg })
        });
        const result = await res.json();

        if (!result.success || !result.data) {
          alert('Data siswa tidak ditemukan!');
          return;
        }

        const student = result.data;

        // Generate HTML for ID Card
        const idCardHTML = generateIDCardHTML(student);

        // For now, just show the generated card in preview
        // In a real implementation, you might use html2canvas or similar to generate image
        document.getElementById('generatedCard').style.display = 'block';
        document.getElementById('downloadLink').href = 'data:text/html;charset=utf-8,' + encodeURIComponent(idCardHTML);
        document.getElementById('downloadLink').download = `IDCard_${noReg}.html`;

        alert('ID Card berhasil di-generate! Klik link download untuk menyimpan.');

      } catch (error) {
        console.error('Error generating ID Card:', error);
        alert('Terjadi kesalahan saat generate ID Card.');
      }
    }

    function generateIDCardHTML(student) {
      return `
        <!DOCTYPE html>
        <html>
        <head>
          <title>ID Card - ${student.nama}</title>
          <style>
            body { font-family: Arial, sans-serif; margin: 20px; }
            .id-card { width: 350px; height: 220px; border: 2px solid #000; padding: 10px; margin: 0 auto; position: relative; background: white; }
            .id-card-text { font-size: 12px; margin: 2px 0; }
            .id-card-logo { max-width: 60px; max-height: 60px; position: absolute; top: 20px; left: 20px; }
            .id-card-content { position: absolute; top: 80px; left: 100px; }
          </style>
        </head>
        <body>
          <div class="id-card">
            ${templateData.logoImage ? `<img src="${templateData.logoImage}" class="id-card-logo" alt="Logo">` : ''}
            <div class="id-card-content">
              <div class="id-card-text fw-bold">${templateData.schoolName}</div>
              <div class="id-card-text">${templateData.schoolAddress}</div>
              <div class="id-card-text">Tahun Ajaran: ${templateData.academicYear}</div>
              <hr style="margin: 5px 0;">
              <div class="id-card-text"><strong>Nama:</strong> ${student.nama}</div>
              <div class="id-card-text"><strong>No Reg:</strong> ${student.noReg}</div>
              <div class="id-card-text"><strong>Status:</strong> SISWA AKTIF</div>
            </div>
          </div>
        </body>
        </html>
      `;
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Login Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #f4f7f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card-login { border-radius: 20px; border: none; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 400px; }
    .btn-gradient { background: linear-gradient(135deg, #00B4DB 0%, #0083B0 100%); color: white; border: none; }
  </style>
</head>
<body>
  <div class="card card-login p-4">
    <div class="card-body">
      <div class="text-center mb-4">
        <i class="fas fa-user-shield fa-3x text-info"></i>
        <h4 class="fw-bold mt-2">Login Admin SPMB</h4>
      </div>
      
      <form onsubmit="handleLogin(this); return false;">
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input type="text" id="username" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" id="password" class="form-control" required>
        </div>
        <div id="errorMsg" class="alert alert-danger d-none text-center"></div>
        <button type="submit" id="btnLogin" class="btn btn-gradient w-100 py-2">Masuk</button>
      </form>
      <div class="text-center mt-4"><a href="index.html" class="text-decoration-none text-muted small"><i class="fas fa-home me-1"></i>Kembali ke Beranda</a></div>
    </div>
  </div>

  <script>
    const API_URL = "MASUKKAN_URL_WEB_APP_GAS_KAMU";

    function handleLogin(form) {
      document.getElementById('btnLogin').disabled = true;
      document.getElementById('errorMsg').classList.add('d-none');
      
      const payload = {
        action: "login",
        username: document.getElementById('username').value,
        password: document.getElementById('password').value
      };

      fetch(API_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(response => {
        if (response.success) {
          localStorage.setItem('admin_token', response.token);
          window.location.href = "admin.html";
        } else {
          var errDiv = document.getElementById('errorMsg');
          errDiv.innerText = response.message;
          errDiv.classList.remove('d-none');
          document.getElementById('btnLogin').disabled = false;
        }
      }).catch(err => {
        alert("Gagal menyambung ke server!");
        document.getElementById('btnLogin').disabled = false;
      });
    }
  </script>
</body>
</html>

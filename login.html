<!DOCTYPE html>
<html lang="id">
<head><title>Login Admin</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-dark text-white"><div class="container mt-5"><div class="row justify-content-center"><div class="col-md-4 card p-4 text-dark">
    <h3 class="text-center">Admin Login</h3>
    <input type="text" id="u" class="form-control mb-2" placeholder="Username">
    <input type="password" id="p" class="form-control mb-3" placeholder="Password">
    <button onclick="doLogin()" class="btn btn-primary w-100">MASUK</button>
</div></div></div>
<script src="config.js"></script>
<script>
    function doLogin() {
        const u = document.getElementById('u').value;
        const p = document.getElementById('p').value;
        if(u === ADMIN_USER && p === ADMIN_PASS) {
            localStorage.setItem('isLogin', 'true');
            window.location.href='admin.html';
        } else {
            alert("Login gagal! Username atau password salah.");
        }
    }
</script>
</body></html>

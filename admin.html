<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #f4f7f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .card-stats { border: none; border-radius: 12px; }
    .table-container { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
  </style>
</head>
<body>
  <div class="container-fluid my-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div><h3 class="fw-bold m-0"><i class="fas fa-chart-line text-info me-2"></i>Dashboard Admin SPMB</h3></div>
      <button onclick="handleLogout()" class="btn btn-outline-danger"><i class="fas fa-sign-out-alt me-1"></i>Logout</button>
    </div>

    <div class="row g-4 mb-4">
      <div class="col-md-4"><div class="card card-stats p-3 text-white" style="background: linear-gradient(135deg, #00B4DB, #0083B0);"><h5>Total Pendaftar</h5><h2 id="statTotal" class="fw-bold">0</h2></div></div>
      <div class="col-md-4"><div class="card card-stats p-3 text-white" style="background: linear-gradient(135deg, #11998e, #38ef7d);"><h5>Diterima</h5><h2 id="statDiterima" class="fw-bold">0</h2></div></div>
      <div class="col-md-4"><div class="card card-stats p-3 text-white" style="background: linear-gradient(135deg, #FF416C, #FF4B2B);"><h5>Ditolak</h5><h2 id="statDitolak" class="fw-bold">0</h2></div></div>
    </div>

    <div class="table-container">
      <div class="row mb-3"><div class="col-md-4"><input type="text" id="searchInput" class="form-control" placeholder="Cari nama..." onkeyup="filterTable()"></div></div>
      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead class="table-light"><tr><th>No Registrasi</th><th>Nama</th><th>No HP</th><th>Status</th><th>Aksi</th></tr></thead>
          <tbody id="dataTableBody"><tr><td colspan="5" class="text-center py-4">Memuat data...</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "MASUKKAN_URL_WEB_APP_GAS_KAMU";
    const token = localStorage.getItem('admin_token');
    
    if (!token) window.location.href = "login.html";
    window.onload = function() { loadData(); };

    function loadData() {
      fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ action: "getData", token: token })
      })
      .then(res => res.json())
      .then(res => {
        if(res.success) renderTable(res.data);
        else alert(res.message);
      });
    }

    function renderTable(data) {
      const tbody = document.getElementById('dataTableBody');
      tbody.innerHTML = '';
      let total = 0, diterima = 0, ditolak = 0;
      
      data.forEach(item => {
        total++;
        let badgeClass = 'bg-warning text-dark';
        if (item.status === 'DITERIMA') { badgeClass = 'bg-success'; diterima++; }
        else if (item.status === 'DITOLAK') { badgeClass = 'bg-danger'; ditolak++; }
        
        const row = `
          <tr>
            <td><b>${item.noReg}</b></td>
            <td>${item.nama}</td>
            <td>${item.hp}</td>
            <td><span class="badge ${badgeClass}">${item.status}</span></td>
            <td>
              <button onclick="updateStatus('${item.noReg}', 'DITERIMA')" class="btn btn-sm btn-success" ${item.status === 'DITERIMA' ? 'disabled' : ''}>Terima</button>
              <button onclick="updateStatus('${item.noReg}', 'DITOLAK')" class="btn btn-sm btn-danger" ${item.status === 'DITOLAK' ? 'disabled' : ''}>Tolak</button>
            </td>
          </tr>`;
        tbody.innerHTML += row;
      });
      document.getElementById('statTotal').innerText = total;
      document.getElementById('statDiterima').innerText = diterima;
      document.getElementById('statDitolak').innerText = ditolak;
    }

    function updateStatus(noReg, status) {
      fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ action: "updateStatus", token: token, noReg: noReg, status: status })
      })
      .then(res => res.json())
      .then(res => { if(res.success) loadData(); });
    }

    function filterTable() {
      const filter = document.getElementById("searchInput").value.toUpperCase();
      const tr = document.getElementById("dataTableBody").getElementsByTagName("tr");
      for (let i = 0; i < tr.length; i++) {
        const td = tr[i].getElementsByTagName("td");
        if (td) tr[i].style.display = (td.textContent || td.innerText).toUpperCase().indexOf(filter) > -1 ? "" : "none";
      }
    }

    function handleLogout() {
      localStorage.removeItem('admin_token');
      window.location.href = "index.html";
    }
  </script>
</body>
</html>

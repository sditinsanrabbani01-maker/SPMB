<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Pendaftaran Ditutup</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .closed-section {
      background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
      color: white; padding: 100px 0; border-bottom-left-radius: 50px; border-bottom-right-radius: 50px;
    }
    .card-closed { border: none; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
  </style>
</head>
<body>
  <div class="closed-section text-center">
    <div class="container">
      <h1 class="display-4 fw-bold"><i class="fas fa-clock me-3"></i>Pendaftaran Ditutup</h1>
      <p class="lead">Pendaftaran SPMB SDIT Insan Rabbani sedang ditutup.</p>
      <p class="fst-italic">Silakan cek kembali pada waktu yang telah ditentukan.</p>
    </div>
  </div>

  <div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card card-closed p-4 text-center">
          <div class="card-body">
            <h5 class="card-title">Informasi Pendaftaran</h5>
            <p class="card-text">Untuk informasi lebih lanjut, silakan hubungi panitia pendaftaran.</p>
            <a href="index.html" class="btn btn-primary">
              <i class="fas fa-arrow-left me-2"></i>Kembali ke Beranda
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

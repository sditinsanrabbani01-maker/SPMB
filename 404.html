<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Tidak Ditemukan - SPMB SDIT Insan Rabbani</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .hero-section {
            background: linear-gradient(135deg, #00B4DB 0%, #0141a4 100%);
            color: white;
            padding: 30px 0;
            margin-bottom: 20px;
        }
        .error-container {
            text-align: center;
            padding: 80px 20px;
        }
        .error-code {
            font-size: 8rem;
            font-weight: bold;
            color: #dc3545;
            margin-bottom: 20px;
        }
        .error-title {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: #333;
        }
        .error-message {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 30px;
        }
        .btn-home {
            background: linear-gradient(135deg, #00B4DB 0%, #0141a4 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            border-radius: 50px;
            transition: all 0.3s ease;
        }
        .btn-home:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <!-- Header Section -->
    <div class="hero-section text-center">
        <div class="container">
            <h1 class="display-5 fw-bold mb-0">SDIT INSAN RABBANI</h1>
            <p class="lead mb-0">Sistem Pendaftaran Peserta Didik Baru</p>
        </div>
    </div>
    
    <div class="container">
        <div class="error-container">
            <div class="error-code">404</div>
            <div class="error-title">Halaman Tidak Ditemukan</div>
            <div class="error-message">
                Maaf, halaman yang Anda cari tidak dapat ditemukan.
            </div>
            <a href="index.html" class="btn btn-home">
                <i class="fas fa-home me-2"></i>Kembali ke Beranda
            </a>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran SPMB Online</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', sans-serif; }
        .card-spmb { border-radius: 15px; border: none; box-shadow: 0 5px 20px rgba(0,0,0,0.1); overflow: hidden; }
        .header-spmb { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: white; padding: 25px; }
        .btn-submit { background: #1e3c72; color: white; border: none; padding: 12px; font-weight: bold; width: 100%; transition: 0.3s; }
        .btn-submit:hover { background: #2a5298; transform: translateY(-2px); }
        .loader { display: none; width: 25px; height: 25px; border: 3px solid #f3f3f3; border-top: 3px solid #ffffff; border-radius: 50%; animation: spin 1s linear infinite; margin: auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .form-label { font-weight: 600; color: #444; }
    </style>
</head>
<body>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-9">
            <div class="card card-spmb">
                <div class="header-spmb text-center">
                    <h3 class="mb-1">Formulir Pendaftaran SPMB</h3>
                    <p class="mb-0 opacity-75" id="displaySchoolName"></p>
                </div>
                <div class="card-body p-4">
                    <form id="formSpmb" onsubmit="handleSpmbSubmit(); return false;">
                        
                        <h6 class="text-primary fw-bold mb-3 border-bottom pb-2"><i class="fas fa-user-graduate me-2"></i>I. Data Diri Calon Siswa</h6>
                        <div class="row">
                            <div class="col-md-8 mb-3"><label class="form-label">Nama Lengkap</label><input type="text" id="nama" class="form-control" placeholder="Nama sesuai ijazah" required></div>
                            <div class="col-md-4 mb-3"><label class="form-label">NISN</label><input type="number" id="nisn" class="form-control" required></div>
                            <div class="col-md-6 mb-3"><label class="form-label">Tempat, Tanggal Lahir</label><input type="text" id="ttl" class="form-control" placeholder="Jakarta, 01-01-2010" required></div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Jenis Kelamin</label>
                                <select id="jk" class="form-select" required>
                                    <option value="">Pilih...</option>
                                    <option value="Laki-laki">Laki-laki</option>
                                    <option value="Perempuan">Perempuan</option>
                                </select>
                            </div>
                            <div class="col-md-12 mb-3"><label class="form-label">Alamat Domisili</label><textarea id="alamat" class="form-control" rows="2" required></textarea></div>
                        </div>

                        <h6 class="text-primary fw-bold mt-3 mb-3 border-bottom pb-2"><i class="fas fa-users me-2"></i>II. Data Orang Tua & Kontak</h6>
                        <div class="row">
                            <div class="col-md-6 mb-3"><label class="form-label">Nama & Pekerjaan Ayah</label><input type="text" id="ayah_data" class="form-control" placeholder="Contoh: Budi - Karyawan" required></div>
                            <div class="col-md-6 mb-3"><label class="form-label">Nama & Pekerjaan Ibu</label><input type="text" id="ibu_data" class="form-control" placeholder="Contoh: Ani - IRT" required></div>
                            <div class="col-md-6 mb-3"><label class="form-label">No. WhatsApp Aktif</label><input type="tel" id="hp" class="form-control" placeholder="08xxxx" required></div>
                            <div class="col-md-6 mb-3"><label class="form-label">Asal Sekolah</label><input type="text" id="sekolah" class="form-control" required></div>
                        </div>

                        <h6 class="text-primary fw-bold mt-3 mb-3 border-bottom pb-2"><i class="fas fa-file-upload me-2"></i>III. Unggah Dokumen (Maks 5MB)</h6>
                        <div class="row g-3 bg-light p-3 rounded">
                            <div class="col-md-6"><label class="small fw-bold">Pas Foto Siswa</label><input type="file" id="f_foto" class="form-control" accept="image/*" required></div>
                            <div class="col-md-6"><label class="small fw-bold">Kartu Keluarga (KK)</label><input type="file" id="f_kk" class="form-control" accept="image/*,.pdf" required></div>
                            <div class="col-md-6"><label class="small fw-bold">Akta Kelahiran</label><input type="file" id="f_akta" class="form-control" accept="image/*,.pdf" required></div>
                            <div class="col-md-6"><label class="small fw-bold">Bukti Pembayaran</label><input type="file" id="f_bayar" class="form-control" accept="image/*,.pdf" required></div>
                        </div>

                        <div class="mt-4">
                            <button type="submit" id="btnKirim" class="btn btn-submit">
                                <span id="btnText">KIRIM PENDAFTARAN</span>
                                <div class="loader" id="loader"></div>
                            </button>
                        </div>
                    </form>

                    <div id="successMsg" class="alert alert-success mt-4 d-none text-center p-4">
                        <i class="fas fa-check-circle fa-4x mb-3 text-success"></i>
                        <h3 class="fw-bold">Pendaftaran Berhasil!</h3>
                        <p>Nomor Registrasi Anda adalah:</p>
                        <div class="display-5 fw-bold text-dark mb-3" id="resNoReg"></div>
                        <p class="text-muted small">Silakan screenshot halaman ini sebagai bukti pendaftaran.</p>
                        <button onclick="location.reload()" class="btn btn-primary mt-2 px-4">Daftar Kembali</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="config.js"></script>
<script>
    // Inisialisasi Nama Sekolah dari Config
    document.getElementById('displaySchoolName').innerText = NAMA_SEKOLAH;

    async function fileToBase64(file) {
        if (!file) return null;
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = e => reject(e);
            reader.readAsDataURL(file);
        });
    }

    async function handleSpmbSubmit() {
        const btn = document.getElementById('btnKirim');
        const btnText = document.getElementById('btnText');
        const loader = document.getElementById('loader');

        btn.disabled = true;
        btnText.style.display = 'none';
        loader.style.display = 'block';

        const payload = {
            action: "submitForm",
            data: {
                nama: document.getElementById('nama').value,
                nisn: document.getElementById('nisn').value,
                ttl: document.getElementById('ttl').value,
                jk: document.getElementById('jk').value,
                alamat: document.getElementById('alamat').value,
                ayah: document.getElementById('ayah_data').value,
                ibu: document.getElementById('ibu_data').value,
                hp: document.getElementById('hp').value,
                sekolah: document.getElementById('sekolah').value
            }
        };

        try {
            const f1 = document.getElementById('f_foto').files;
            const f2 = document.getElementById('f_kk').files;
            const f3 = document.getElementById('f_akta').files;
            const f4 = document.getElementById('f_bayar').files;

            if(f1) payload.data.foto = await fileToBase64(f1);
            if(f2) payload.data.kk = await fileToBase64(f2);
            if(f3) payload.data.akta = await fileToBase64(f3);
            if(f4) payload.data.bayar = await fileToBase64(f4);

            const response = await fetch(CONFIG_API_URL, {
                method: "POST",
                body: JSON.stringify(payload)
            });
            const result = await response.json();

            if(result.success) {
                document.getElementById('formSpmb').classList.add('d-none');
                document.getElementById('successMsg').classList.remove('d-none');
                document.getElementById('resNoReg').innerText = result.regNo;
                window.scrollTo(0,0);
            } else {
                alert("Gagal: " + result.message);
            }
        } catch (error) {
            console.error(error);
            alert("Kesalahan Sistem! Pastikan koneksi internet stabil dan ukuran file tidak terlalu besar.");
        } finally {
            btn.disabled = false;
            btnText.style.display = 'inline';
            loader.style.display = 'none';
        }
    }
</script>
</body>
</html>

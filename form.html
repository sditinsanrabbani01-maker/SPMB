<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8"><title>Pendaftaran SPMB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>.header-spmb { background: #1e3c72; color: white; padding: 20px; border-radius: 10px 10px 0 0; }</style>
</head>
<body class="bg-light">
<div class="container my-5"><div class="row justify-content-center"><div class="col-md-9 card shadow-sm p-0">
    <div class="header-spmb text-center"><h3 id="schName"></h3><p>Formulir Pendaftaran Online</p></div>
    <div class="card-body p-4">
        <form id="formSpmb" onsubmit="handleSpmbSubmit(); return false;">
            <div class="row mb-3">
                <div class="col-md-8"><label>Nama Lengkap</label><input type="text" id="nama" class="form-control" required></div>
                <div class="col-md-4"><label>NISN</label><input type="number" id="nisn" class="form-control" required></div>
            </div>
            <div class="row mb-3">
                <div class="col-md-6"><label>WhatsApp</label><input type="tel" id="hp" class="form-control" required></div>
                <div class="col-md-6"><label>Asal Sekolah</label><input type="text" id="sekolah" class="form-control" required></div>
            </div>
            <div class="row g-2 mb-4 p-3 bg-light border rounded">
                <div class="col-md-6"><label class="small">Foto</label><input type="file" id="f_foto" class="form-control" accept="image/*" required></div>
                <div class="col-md-6"><label class="small">Bukti Bayar</label><input type="file" id="f_bayar" class="form-control" accept="image/*,.pdf" required></div>
            </div>
            <button type="submit" id="btnKirim" class="btn btn-primary w-100 fw-bold">KIRIM PENDAFTARAN</button>
        </form>
        <div id="successMsg" class="alert alert-success mt-4 d-none text-center">
            <h4>Sukses! No Registrasi Anda:</h4><h2 id="resNoReg"></h2>
        </div>
    </div>
</div></div></div>
<script src="config.js"></script>
<script>
    document.getElementById('schName').innerText = NAMA_SEKOLAH;
    async function fileToBase64(file) {
        if(!file) return null;
        return new Promise((r,j) => { const rd = new FileReader(); rd.onload=()=>r(rd.result); rd.readAsDataURL(file); });
    }
    async function handleSpmbSubmit() {
        const btn = document.getElementById('btnKirim'); btn.disabled = true;
        const payload = { action: "submitForm", data: { nama: document.getElementById('nama').value, nisn: document.getElementById('nisn').value, hp: document.getElementById('hp').value, sekolah: document.getElementById('sekolah').value } };
        try {
            const f1 = document.getElementById('f_foto').files;
            const f2 = document.getElementById('f_bayar').files;
            if(f1) payload.data.foto = await fileToBase64(f1);
            if(f2) payload.data.bayar = await fileToBase64(f2);
            const res = await fetch(CONFIG_API_URL, { method: "POST", body: JSON.stringify(payload) });
            const result = await res.json();
            if(result.success) { document.getElementById('formSpmb').classList.add('d-none'); document.getElementById('successMsg').classList.remove('d-none'); document.getElementById('resNoReg').innerText = result.regNo; }
        } catch (e) { alert("Error: " + e.message); btn.disabled = false; }
    }
</script>
</body></html>
